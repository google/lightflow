name: tenant_gitops_onboarding
description: >-
  Enterprise 22-stage multi-branch Kubernetes + Cloud IAM + ArgoCD GitOps tenant
  onboarding workflow. Demonstrates role-based early handoff, 3-way IAM status
  fan-out with human-in-the-loop quota override and ALL_DONE convergence,
  parallel backing-resource provisioning (S3/Vault + compliance-tier KMS
  branching) with automatic retry/rollback, and two-phase GitOps PR + ArgoCD
  application sync polling.

actions:
  # Phase 1: Spec Resolution, RBAC Check & Change Advisory Gate
  - id: initialize_spec
    python_import: examples.tenant_gitops_onboarding.actions.initialize_spec
  - id: check_operator_is_admin
    python_import: examples.tenant_gitops_onboarding.actions.check_operator_is_admin
  - id: create_provisioning_request
    python_import: examples.tenant_gitops_onboarding.actions.create_provisioning_request
  - id: stop_non_admin
    python_import: examples.tenant_gitops_onboarding.actions.stop_non_admin
  - id: check_governance_approval
    python_import: examples.tenant_gitops_onboarding.actions.check_governance_approval

  # Phase 2: IdP Groups, SCIM 2.0 Push & Cloud IAM Workload Identity
  - id: provision_identity_groups
    python_import: examples.tenant_gitops_onboarding.actions.provision_identity_groups
  - id: check_scim_ready
    python_import: examples.tenant_gitops_onboarding.actions.check_scim_ready
  - id: create_workload_iam_role
    python_import: examples.tenant_gitops_onboarding.actions.create_workload_iam_role
  - id: fail_workflow
    python_import: examples.tenant_gitops_onboarding.actions.fail_workflow
  - id: check_iam_role_ready
    python_import: examples.tenant_gitops_onboarding.actions.check_iam_role_ready

  # Phase 3: Parallel Backing-Resource Diamond & Compliance-Tier KMS Branch
  - id: provision_external_resources
    python_import: examples.tenant_gitops_onboarding.actions.provision_external_resources
  - id: rollback_external_resources
    python_import: examples.tenant_gitops_onboarding.actions.rollback_external_resources
  - id: provision_dedicated_kms_key
    python_import: examples.tenant_gitops_onboarding.actions.provision_dedicated_kms_key
  - id: apply_shared_kms_policy
    python_import: examples.tenant_gitops_onboarding.actions.apply_shared_kms_policy
  - id: checkpoint_registry
    python_import: examples.tenant_gitops_onboarding.actions.checkpoint_registry

  # Phase 4: Declarative GitOps PRs & ArgoCD Sync
  - id: scaffold_k8s_gitops_pr
    python_import: examples.tenant_gitops_onboarding.actions.scaffold_k8s_gitops_pr
  - id: package_mesh_and_catalog_pr
    python_import: examples.tenant_gitops_onboarding.actions.package_mesh_and_catalog_pr
  - id: check_pr_merged
    python_import: examples.tenant_gitops_onboarding.actions.check_pr_merged
  - id: check_argocd_synced
    python_import: examples.tenant_gitops_onboarding.actions.check_argocd_synced

stages:
  # ============================================================================
  # PHASE 1: Spec Resolution, RBAC Check & Change Advisory Gate (6 stages)
  # Branching Pattern #1: Role-Based Early Handoff (is_admin false vs true)
  # ============================================================================
  - name: init_spec
    description: Resolve tenant specification, Kubernetes namespace, and compliance tier
    python_action:
      action_id: initialize_spec

  - name: check_admin
    description: Verify whether the invoking operator holds platform-admin RBAC privileges
    run_after:
      - init_spec
    python_action:
      action_id: check_operator_is_admin

  - name: verify_spec
    description: Human/agent pre-flight review of resolved tenant specification
    run_after:
      - check_admin
    operator_action:
      instructions: >-
        'Review resolved specification for tenant "' + payload.outputs.init_spec.alias + '" (namespace: "' + payload.outputs.init_spec.k8s_namespace + '", compliance_tier: "' + payload.outputs.init_spec.compliance_tier + '"). Confirm with requester before opening Change Advisory ticket:'
      json_schema:
        type: object
        required:
          - approved
        properties:
          approved:
            type: boolean

  - name: create_ticket
    description: Open an auditable Change Advisory Board (CAB) provisioning request
    run_after:
      - verify_spec
    run_if: "payload.outputs.verify_spec.approved == true"
    python_action:
      action_id: create_provisioning_request

  - name: stop_non_admin_stage
    description: Early handoff exit for non-admin requesters after ticket creation
    run_after:
      - create_ticket
    run_if: "payload.outputs.check_admin.is_admin == false"
    python_action:
      action_id: stop_non_admin

  - name: wait_governance_approval
    description: Poll Change Advisory Board ticket until approved for actuation
    run_after:
      - create_ticket
    run_if: "payload.outputs.check_admin.is_admin == true"
    python_action:
      action_id: check_governance_approval
    polling_policy:
      condition: "payload.outputs.wait_governance_approval.governance_approved == true"
      interval_seconds: 1
      timeout_seconds: 30

  # ============================================================================
  # PHASE 2: IdP Groups, SCIM 2.0 Push & Cloud IAM Workload Identity (6 stages)
  # Branching Pattern #2: 3-Way Status Fan-Out + ALL_DONE Convergence
  # ============================================================================
  - name: provision_identity_groups
    description: Create 3-tier IdP RBAC groups (admins, devs, workloads) and initiate SCIM push
    run_after:
      - wait_governance_approval
    python_action:
      action_id: provision_identity_groups

  - name: wait_scim_sync
    description: Poll SCIM 2.0 downstream group replication until SYNCED
    run_after:
      - provision_identity_groups
    python_action:
      action_id: check_scim_ready
    polling_policy:
      condition: "payload.outputs.wait_scim_sync.scim_ready == true"
      interval_seconds: 1
      timeout_seconds: 30

  - name: create_workload_iam_role
    description: Create Cloud IAM role with OIDC Workload Identity trust for Kubernetes ServiceAccount
    run_after:
      - wait_scim_sync
    python_action:
      action_id: create_workload_iam_role

  - name: fail_on_iam_failed
    description: Terminal failure handler when Cloud IAM role creation returns FAILED
    run_after:
      - create_workload_iam_role
    run_if: "payload.outputs.create_workload_iam_role.iam_status == 'FAILED'"
    python_action:
      action_id: fail_workflow

  - name: prompt_iam_quota_override
    description: Conditional human/agent security sign-off when IAM role hits QUOTA_EXCEEDED
    run_after:
      - create_workload_iam_role
    run_if: "payload.outputs.create_workload_iam_role.iam_status == 'QUOTA_EXCEEDED'"
    operator_action:
      instructions: >-
        'Cloud IAM role "' + payload.outputs.create_workload_iam_role.iam_role_arn + '" returned QUOTA_EXCEEDED. Approve IAM quota override and OIDC trust exception to continue:'
      json_schema:
        type: object
        required:
          - approved
          - quota_override_approved
        properties:
          approved:
            type: boolean
          quota_override_approved:
            type: boolean
            const: true

  - name: wait_iam_role_ready
    description: Converge auto-created and manual-override IAM paths and verify OIDC trust propagation
    run_after:
      - prompt_iam_quota_override
    trigger_rule: ALL_DONE
    run_if: "payload.outputs.create_workload_iam_role.iam_status == 'SUCCESS' || (payload.outputs.create_workload_iam_role.iam_status == 'QUOTA_EXCEEDED' && payload.outputs.prompt_iam_quota_override.approved == true && payload.outputs.prompt_iam_quota_override.quota_override_approved == true)"
    python_action:
      action_id: check_iam_role_ready
    polling_policy:
      condition: "payload.outputs.wait_iam_role_ready.iam_role_ready == true"
      interval_seconds: 1
      timeout_seconds: 30

  # ============================================================================
  # PHASE 3: Parallel Backing-Resource Diamond + KMS Compliance Branch (4 stages)
  # Branching Pattern #3: Concurrent Multi-Track Diamond + Mutual-Exclusion Branch
  # ============================================================================
  - name: provision_external_resources
    description: Provision S3 Terraform state bucket and Vault KV mount with retry and compensating rollback
    run_after:
      - wait_iam_role_ready
    python_action:
      action_id: provision_external_resources
    retry_policy:
      max_attempts: 2
      initial_backoff_seconds: 1
      backoff_multiplier: 1.0
    rollback_action:
      action_id: rollback_external_resources

  - name: provision_dedicated_kms_key
    description: Provision dedicated HSM-backed Customer-Managed KMS Key (CMK) for PCI tenants
    run_after:
      - wait_iam_role_ready
    run_if: "payload.outputs.init_spec.compliance_tier == 'pci'"
    python_action:
      action_id: provision_dedicated_kms_key

  - name: apply_shared_kms_policy
    description: Bind tenant IAM role to shared multi-tenant KMS key for standard/hipaa tiers
    run_after:
      - wait_iam_role_ready
    run_if: "payload.outputs.init_spec.compliance_tier != 'pci'"
    python_action:
      action_id: apply_shared_kms_policy

  - name: checkpoint_catalog
    description: Join storage and KMS tracks and commit validated coordinates to platform catalog
    run_after:
      - provision_external_resources
      - provision_dedicated_kms_key
      - apply_shared_kms_policy
    trigger_rule: ALL_DONE
    run_if: "payload.outputs.provision_external_resources.storage_provisioned == true && (payload.outputs.provision_dedicated_kms_key.kms_ready == true || payload.outputs.apply_shared_kms_policy.kms_ready == true)"
    python_action:
      action_id: checkpoint_registry

  # ============================================================================
  # PHASE 4: Declarative GitOps PRs & ArgoCD Sync (6 stages)
  # ============================================================================
  - name: scaffold_k8s_gitops_pr
    description: Render Kustomize namespace, RBAC, ServiceAccount, NetworkPolicy, and ExternalSecret PR
    run_after:
      - checkpoint_catalog
    python_action:
      action_id: scaffold_k8s_gitops_pr

  - name: wait_k8s_gitops_pr
    description: Poll GitOps repository until Kubernetes namespace overlay PR is merged
    run_after:
      - scaffold_k8s_gitops_pr
    python_action:
      action_id: check_pr_merged
      static_kwargs:
        target_stage: scaffold_k8s_gitops_pr
        target_pr_key: k8s_pr_id
    polling_policy:
      condition: "payload.outputs.wait_k8s_gitops_pr.pr_merged == true"
      interval_seconds: 1
      timeout_seconds: 60

  - name: wait_argocd_namespace_sync
    description: Poll ArgoCD until tenant-namespace Application reports Synced and Healthy
    run_after:
      - wait_k8s_gitops_pr
    python_action:
      action_id: check_argocd_synced
      static_kwargs:
        app_name: tenant-namespace
        required_pr_stage: wait_k8s_gitops_pr
    polling_policy:
      condition: "payload.outputs.wait_argocd_namespace_sync.app_synced == true"
      interval_seconds: 1
      timeout_seconds: 30

  - name: package_mesh_and_catalog_pr
    description: Open GitOps PR for Gateway API HTTPRoute, Prometheus ServiceMonitor, and catalog entry
    run_after:
      - wait_argocd_namespace_sync
    python_action:
      action_id: package_mesh_and_catalog_pr

  - name: wait_mesh_and_catalog_pr
    description: Poll GitOps repository until mesh routing and catalog PR is merged
    run_after:
      - package_mesh_and_catalog_pr
    python_action:
      action_id: check_pr_merged
      static_kwargs:
        target_stage: package_mesh_and_catalog_pr
        target_pr_key: catalog_pr_id
    polling_policy:
      condition: "payload.outputs.wait_mesh_and_catalog_pr.pr_merged == true"
      interval_seconds: 1
      timeout_seconds: 60

  - name: wait_argocd_mesh_sync
    description: Poll ArgoCD until mesh-and-catalog Application reports Synced and Healthy
    run_after:
      - wait_mesh_and_catalog_pr
    python_action:
      action_id: check_argocd_synced
      static_kwargs:
        app_name: mesh-and-catalog
        required_pr_stage: wait_mesh_and_catalog_pr
    polling_policy:
      condition: "payload.outputs.wait_argocd_mesh_sync.app_synced == true"
      interval_seconds: 1
      timeout_seconds: 30
